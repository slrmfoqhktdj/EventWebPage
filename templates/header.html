{{define "header"}}
<!DOCTYPE html>
<html lang="en">
  <head>

      charset="UTF-8"
      name="viewport"
      content="width=device-width,initial-scale=1"
    />

    <script type="module" src="js/header.js" defer></script>
    <link rel="stylesheet" href="css/index.css" />
